<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>cupbored · walkthrough player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #yt { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <!--
    Minimal first-party YouTube player page for the cupbored mobile app's walkthrough WebView.
    Why this exists: YouTube only autoplays an inline embed when the page is served from a real https
    origin (GitHub Pages here). The app loads it as ...?v=<id>&mute=<0|1>, or as ...?warm=1 once at
    startup to prime the cache. It is intentionally tiny and
    self-contained — the only third-party scripts are YouTube's own, the video id is strictly validated
    before it touches the embed URL, and the page can only post {type:'ready'|'error'} back to the app.
  -->
  <iframe id="yt" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <script>
    (function () {
      function post(msg) {
        try {
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify(msg));
          }
        } catch (e) {}
      }

      var params = new URLSearchParams(window.location.search);
      var id = params.get('v') || '';
      var mute = params.get('mute') === '1' ? 1 : 0;

      // Warm-up load (?warm=1), which the app does once at startup in an offscreen WebView. It
      // fetches YouTube's IFrame API so the first real player starts from cache rather than paying
      // for it while someone waits on a black frame. No id, no embed, no playback, nothing posted
      // back — the only purpose is to fill the WebView's HTTP cache.
      if (params.get('warm') === '1') {
        var warmTag = document.createElement('script');
        warmTag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(warmTag);
        return;
      }

      // Only a real 11-character YouTube id is ever interpolated into the embed URL.
      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
        post({ type: 'error', code: 'invalid_id' });
        return;
      }

      // autoplay=0 is the app's preload mode: the neighbouring page in the recipe pager loads the
      // embed for its video offscreen so the per-video assets are cached before anyone swipes to it.
      var autoplay = params.get('autoplay') === '0' ? 0 : 1;

      var origin = window.location.origin;
      var iframe = document.getElementById('yt');
      iframe.src =
        'https://www.youtube.com/embed/' + id +
        '?autoplay=' + autoplay + '&mute=' + mute +
        '&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=' + encodeURIComponent(origin);

      // Attach the IFrame API to the already-autoplaying iframe purely to surface ready/error to the app.
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      // Play/pause commands, injected by the app. The recipe pager keeps the neighbouring pages'
      // players mounted and paused, so landing on one is a command to an already-loaded player
      // rather than a fresh embed to fetch — which is the whole of the wait it replaces. Defined
      // before the API attaches so an early call is a no-op rather than a crash.
      // `desired` is what the app last asked for, remembered even when it arrives before the player
      // exists. Without it, a page swiped away from mid-load would autoplay to nobody the moment it
      // finished — the app cannot un-ask, because a command sent to a player that is not there yet
      // has nothing to act on.
      var ytPlayer = null;
      var desired = null;

      /**
       * Starts playback with sound, and settles for muted only if that did not actually start.
       *
       * Every start goes through here, not just the first. The page that loads with autoplay=1 in
       * its URL gets sound for free; a page STARTED BY COMMAND is a different path, and YouTube's
       * own player mutes itself there when it cannot prove a user gesture — which is why the first
       * recipe played aloud and every one swiped to afterwards was silent.
       *
       * unMute() before play, then check: if it did not start, that device really does refuse, so
       * mute and start it. A muted video is what we had before any of this, and it is better than a
       * still frame.
       */
      function startPlayback() {
        if (!ytPlayer) return;
        try {
          ytPlayer.unMute();
          ytPlayer.playVideo();
        } catch (e) {}
        setTimeout(function () {
          if (desired !== 'play') return;
          try {
            if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING && !ytPlayer.isMuted()) {
              post({ type: 'audio', muted: false });
              return;
            }
            ytPlayer.mute();
            ytPlayer.playVideo();
            post({ type: 'audio', muted: true });
          } catch (e) {}
        }, 900);
      }

      window.cupbored = {
        play: function () { desired = 'play'; startPlayback(); },
        pause: function () { desired = 'pause'; try { if (ytPlayer) ytPlayer.pauseVideo(); } catch (e) {} }
      };

      window.onYouTubeIframeAPIReady = function () {
        try {
          ytPlayer = new YT.Player('yt', {
            events: {
              onReady: function () {
                post({ type: 'ready' });

                // Honour whatever the app asked for while this was still loading. A page left before
                // it was ready must not start playing now that it is; one that was asked to play, or
                // that loaded with autoplay in its URL, goes through the same start as every other.
                if (desired === 'pause') {
                  try { ytPlayer.pauseVideo(); } catch (e) {}
                  return;
                }
                if (desired === 'play' || (autoplay === 1 && mute === 0)) {
                  desired = 'play';
                  startPlayback();
                }
              },
              onError: function (e) { post({ type: 'error', code: e && e.data }); }
            }
          });
        } catch (e) {
          // If the API can't attach, the raw iframe still plays — treat as ready so the app un-shimmers.
          post({ type: 'ready' });
        }
      };
    })();
  </script>
</body>
</html>
