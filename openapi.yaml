          content:
            text/plain:
              schema:
                type: string
  "/api/v1/profile/user":
    delete:
      summary: destroy
      tags:
      - Api::V1::Profile::User
      responses:
        '204':
          description: does not call Apple::RevokeTokens
        '401':
          description: keeps the account on an incorrect challenge
          content:
            application/json:
              schema:
                type: object
                properties: {}
                required:
                - errors
        '422':
          description: keeps the account on an incorrect challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
    get:
      summary: show
      tags:
      - Api::V1::Profile::User
      responses:
        '200':
          description: does not include other users' bookmarks in saved_count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                        nullable: true
                      verified:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      matchings_count:
                        type: integer
                      saved_count:
                        type: integer
                      oauth_user:
                        type: boolean
                    required:
                    - id
                    - email
                    - display_name
                    - verified
                    - created_at
                    - updated_at
                required:
                - data
        '401':
          description: returns 401 when unauthenticated
          content:
            text/plain:
              schema:
                type: string
    patch:
      summary: update
      tags:
      - Api::V1::Profile::User
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                display_name:
                  type: string
              required:
              - display_name
      responses:
        '200':
          description: returns 200 with the updated display_name and user id, and
            persists the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      display_name:
                        type: string
                    required:
                    - id
                    - display_name
                required:
                - data
        '422':
          description: rejects a duplicate display_name case-insensitively with errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
