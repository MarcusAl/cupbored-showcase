                          type: string
                        user_display_name:
                          nullable: true
                          type: string
                        public:
                          type: boolean
                        ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                            required:
                            - name
                        recipes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              thumbnail_url:
                                nullable: true
                                type: string
                            required:
                            - id
                            - title
                            - thumbnail_url
                        scan_id:
                          type: string
                      required:
                      - id
                      - scan_image_url
                      - ingredient_count
                      - recipe_count
                      - saves_count
                      - created_at
                      - user_display_name
                      - public
