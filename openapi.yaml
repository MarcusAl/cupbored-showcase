      summary: create
      tags:
      - Api::V1::Scan
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                ingredients:
                  type: array
                  items:
                    type: string
                courses:
                  type: array
                  items:
                    type: string
              required:
              - image
      responses:
        '201':
          description: increments the global counter on a successful scan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                      rejection_reason:
                        nullable: true
                      ingredients:
                        nullable: true
                      match_id:
                        nullable: true
                    required:
                    - id
                    - status
                    - rejection_reason
                    - ingredients
                required:
                - data
        '400':
          description: rejects requests without an image
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '422':
          description: rejects invalid courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '429':
          description: returns 429 when the global cap is hit
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '503':
          description: scan processing temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
