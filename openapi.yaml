                      - id
                      - type
                      - name
                      - avatar_url
                      - count
                      - followed
                required:
                - data
  "/api/v1/users/{id}":
    get:
      summary: show
      tags:
      - Api::V1::User
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
