---
openapi: 3.0.3
info:
  title: cupbored.ai API
  version: v1
  description: AI-powered ingredient detection and recipe matching platform
servers:
- url: https://api.cupbored.ai
  description: Production
paths:
  "/api/v1/blocks":
    get:
      summary: index
      tags:
      - Api::V1::Block
      responses:
        '200':
          description: returns blocks most-recent-first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        blocked_user_id:
                          type: string
                        display_name:
                          type: string
                          nullable: true
                      required:
                      - id
                      - blocked_user_id
                      - display_name
                required:
                - data
    post:
      summary: create
      tags:
      - Api::V1::Block
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                match_id:
                  type: string
              required:
              - match_id
      responses:
        '201':
          description: blocks the author of a match and returns 201 with the block
            record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      blocked_user_id:
                        type: string
                    required:
                    - id
                    - blocked_user_id
                required:
                - data
        '404':
          description: returns 404 when the match is another user private match
          content:
            text/html:
              schema:
                type: string
        '422':
          description: returns 422 when blocking the same author twice via different
            matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/blocks/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Block
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: removes a block the current user owns and returns 204
        '404':
          description: returns 404 for a block the current user does not own
          content:
            text/html:
              schema:
                type: string
  "/api/v1/bookmarks":
    get:
      summary: index
      tags:
      - Api::V1::Bookmark
      responses:
        '200':
          description: does not trigger N+1 queries when returning multiple matches
            with recipes and ingredients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        scan_id:
                          type: string
                        scan_image_url:
                          type: string
                        ingredient_count:
                          type: integer
                        recipe_count:
                          type: integer
                        saves_count:
                          type: integer
                        created_at:
                          type: string
                        user_display_name:
                          nullable: true
                        public:
                          type: boolean
                        ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                            required:
                            - name
                        recipes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              thumbnail_url:
                                nullable: true
                                type: string
                            required:
                            - id
                            - title
                            - thumbnail_url
                      required:
                      - id
                      - scan_id
                      - scan_image_url
                      - ingredient_count
                      - recipe_count
                      - saves_count
                      - created_at
                      - user_display_name
                      - public
                      - ingredients
                      - recipes
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
                    required:
                    - page
                    - pages
                    - count
                required:
                - data
                - pagination
    post:
      summary: create
      tags:
      - Api::V1::Bookmark
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                match_id:
                  type: string
              required:
              - match_id
      responses:
        '201':
          description: allows a user to bookmark their own private match
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      match_id:
                        type: string
                    required:
                    - id
                    - match_id
                required:
                - data
        '404':
          description: returns 404 when bookmarking another user private match
          content:
            text/html:
              schema:
                type: string
        '422':
          description: rejects duplicate bookmarks with errors array
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/bookmarks/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Bookmark
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: removes a bookmark
  "/api/v1/identity/email":
    patch:
      summary: update
      tags:
      - Api::V1::Identity::Email
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password_challenge:
                  type: string
              required:
              - email
              - password_challenge
      responses:
        '200':
          description: does not enqueue a verification email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        nullable: true
                      verified:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - email
                    - display_name
                    - verified
                    - created_at
                    - updated_at
                required:
                - data
        '401':
          description: returns unauthorized
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: returns unprocessable content
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/identity/email_verification":
    get:
      summary: show
      tags:
      - Api::V1::Identity::EmailVerification
      parameters:
      - name: sid
        in: query
        required: false
        schema:
          type: string
      responses:
        '204':
          description: marks the user as verified
        '400':
          description: returns bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
    post:
      summary: create
      tags:
      - Api::V1::Identity::EmailVerification
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
      responses:
        '204':
          description: enqueues a verification email
        '401':
          description: returns unauthorized
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/identity/password_reset":
    patch:
      summary: update
      tags:
      - Api::V1::Identity::PasswordReset
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sid:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
              - sid
              - password
              - password_confirmation
      responses:
        '200':
          description: returns the user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        nullable: true
                      verified:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - email
                    - display_name
                    - verified
                    - created_at
                    - updated_at
                required:
                - data
        '400':
          description: returns bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '422':
          description: returns unprocessable content
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
    post:
      summary: create
      tags:
      - Api::V1::Identity::PasswordReset
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
      responses:
        '204':
          description: returns no content without revealing the account state
        '400':
          description: returns bad request
          content:
            application/json:
              schema:
                type: object
                properties: {}
                required:
                - errors
  "/api/v1/matches":
    get:
      summary: index
      tags:
      - Api::V1::Match
      responses:
        '200':
          description: includes matches from all authors when no blocks exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        scan_image_url:
                          type: string
                        ingredient_count:
                          type: integer
                        recipe_count:
                          type: integer
                        saves_count:
                          type: integer
                        created_at:
                          type: string
                        user_display_name:
                          nullable: true
                          type: string
                        public:
                          type: boolean
                        ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                            required:
                            - name
                        recipes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              thumbnail_url:
                                nullable: true
                                type: string
                            required:
                            - id
                            - title
                            - thumbnail_url
                        scan_id:
                          type: string
                      required:
                      - id
                      - scan_image_url
                      - ingredient_count
                      - recipe_count
                      - saves_count
                      - created_at
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
                    required:
                    - page
                    - pages
                    - count
                required:
                - data
                - pagination
        '403':
          description: returns 403 with suspended message when account is banned
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
      parameters:
      - name: cuisines
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: diets
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: flavors
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: max_difficulty
        in: query
        required: false
        schema:
          type: integer
      - name: min_recipes
        in: query
        required: false
        schema:
          type: integer
      - name: min_saves
        in: query
        required: false
        schema:
          type: integer
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
  "/api/v1/matches/{id}":
    get:
      summary: show
      tags:
      - Api::V1::Match
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: returns 200 when the owner requests their own private match
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      public:
                        type: boolean
                      saves_count:
                        type: integer
                      created_at:
                        type: string
                      ingredients:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                          required:
                          - name
                      recipes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            thumbnail_url:
                              nullable: true
                              type: string
                            community_rating:
                              nullable: true
                              type: number
                              format: float
                            community_ratings_count:
                              type: integer
                            total_time_minutes:
                              type: integer
                            servings:
                              nullable: true
                              type: integer
                            difficulty:
                              type: integer
                            rank:
                              type: integer
                            like_count:
                              type: integer
                            dietary_tags:
                              type: array
                              items: {}
                          required:
                          - id
                          - title
                          - thumbnail_url
                          - community_rating
                          - community_ratings_count
                          - total_time_minutes
                          - servings
                          - difficulty
                          - rank
                      scan_image_url:
                        type: string
                      scan_id:
                        type: string
                      user_display_name:
                        nullable: true
                        type: string
                      saved:
                        type: boolean
                      owned:
                        type: boolean
                    required:
                    - id
                    - public
                    - saves_count
                    - created_at
                    - ingredients
                    - recipes
                required:
                - data
        '404':
          description: returns 404 when a non-owner requests a private match
          content:
            text/html:
              schema:
                type: string
    patch:
      summary: update
      tags:
      - Api::V1::Match
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                public:
                  type: string
              required:
              - public
      responses:
        '200':
          description: sets match back to private
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      public:
                        type: boolean
                      saves_count:
                        type: integer
                      created_at:
                        type: string
                      ingredients:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                          required:
                          - name
                      recipes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            thumbnail_url:
                              nullable: true
                            community_rating:
                              nullable: true
                            community_ratings_count:
                              type: integer
                            total_time_minutes:
                              type: integer
                            servings:
                              nullable: true
                            difficulty:
                              type: integer
                            rank:
                              type: integer
                            like_count:
                              type: integer
                            dietary_tags:
                              type: array
                              items: {}
                          required:
                          - id
                          - title
                          - thumbnail_url
                          - community_rating
                          - community_ratings_count
                          - total_time_minutes
                          - servings
                          - difficulty
                          - rank
                      scan_image_url:
                        type: string
                      scan_id:
                        type: string
                      user_display_name:
                        nullable: true
                      saved:
                        type: boolean
                      owned:
                        type: boolean
                    required:
                    - id
                    - public
                    - saves_count
                    - created_at
                    - ingredients
                    - recipes
                required:
                - data
        '404':
          description: returns 404 for another users match
          content:
            text/html:
              schema:
                type: string
  "/api/v1/matches/{id}/scan_image":
    get:
      summary: scan_image
      tags:
      - Api::V1::Match
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: redirects to a presigned image URL for the current users own
            private match
          content:
            text/html:
              schema:
                type: string
        '404':
          description: returns 404 when the scan has no image attached
          content:
            text/html:
              schema:
                type: string
  "/api/v1/oauth/apple":
    post:
      summary: apple
      tags:
      - Api::V1::Oauth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity_token:
                  type: string
                nonce:
                  type: string
                authorization_code:
                  type: string
              required:
              - identity_token
              - nonce
      responses:
        '201':
          description: returns created without calling Apple::ExchangeAuthorizationCode
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        type: object
                        properties:
                          id:
                            type: string
                          created_at:
                            type: string
                          expires_at:
                            type: string
                          ip_address:
                            type: string
                          updated_at:
                            type: string
                          user_agent:
                            nullable: true
                          user_id:
                            type: string
                        required:
                        - id
                        - created_at
                        - expires_at
                        - ip_address
                        - updated_at
                        - user_agent
                        - user_id
                      token:
                        type: string
                    required:
                    - session
                    - token
                required:
                - data
        '401':
          description: rejects an invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '422':
          description: rejects an identity whose email already has a password account
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/oauth/google":
    post:
      summary: google
      tags:
      - Api::V1::Oauth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity_token:
                  type: string
              required:
              - identity_token
      responses:
        '201':
          description: creates a session for a verified Google identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        type: object
                        properties:
                          id:
                            type: string
                          created_at:
                            type: string
                          expires_at:
                            type: string
                          ip_address:
                            type: string
                          updated_at:
                            type: string
                          user_agent:
                            nullable: true
                          user_id:
                            type: string
                        required:
                        - id
                        - created_at
                        - expires_at
                        - ip_address
                        - updated_at
                        - user_agent
                        - user_id
                      token:
                        type: string
                    required:
                    - session
                    - token
                required:
                - data
        '401':
          description: rejects an invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '422':
          description: rejects an identity whose email already has a password account
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/password":
    patch:
      summary: update
      tags:
      - Api::V1::Password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                password_confirmation:
                  type: string
                password_challenge:
                  type: string
              required:
              - password
              - password_confirmation
              - password_challenge
      responses:
        '200':
          description: updates the password with a valid challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      password_digest:
                        type: string
                      email:
                        type: string
                      display_name:
                        nullable: true
                      id:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      verified:
                        type: boolean
                      canonical_email:
                        type: string
                    required:
                    - password_digest
                    - email
                    - display_name
                    - id
                    - created_at
                    - updated_at
                    - verified
                required:
                - data
        '400':
          description: rejects an incorrect password challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '401':
          description: rejects an invalid token
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/profile/cuisine_preferences":
    get:
      summary: show
      tags:
      - Api::V1::Profile::CuisinePreference
      responses:
        '200':
          description: includes the available cuisines list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cuisines:
                        type: array
                        items:
                          type: string
                      available:
                        type: array
                        items:
                          type: string
                    required:
                    - cuisines
                    - available
                required:
                - data
    put:
      summary: update
      tags:
      - Api::V1::Profile::CuisinePreference
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                cuisines:
                  type: array
                  items:
                    type: string
              required:
              - cuisines
      responses:
        '200':
          description: ignores invalid cuisines
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cuisines:
                        type: array
                        items:
                          type: string
                    required:
                    - cuisines
                required:
                - data
  "/api/v1/profile/cuisine_suggestions":
    post:
      summary: create
      tags:
      - Api::V1::Profile::CuisineSuggestion
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      responses:
        '201':
          description: creates a cuisine suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                    required:
                    - id
                    - name
                required:
                - data
        '422':
          description: rejects blank suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/profile/diet_preferences":
    get:
      summary: show
      tags:
      - Api::V1::Profile::DietPreference
      responses:
        '200':
          description: includes the available diets list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      diets:
                        type: array
                        items:
