          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      display_name:
                        nullable: true
                        type: string
                      avatar_url:
                        nullable: true
                        type: string
                      matches_count:
                        type: integer
                      followed:
                        type: boolean
                    required:
                    - id
                    - display_name
                    - avatar_url
                    - matches_count
                    - followed
                required:
                - data
        '404':
          description: returns 404 when they have blocked the current user
          content:
            text/html:
              schema:
                type: string
  "/api/v1/users/{user_id}/matches":
    get:
      summary: matches
      tags:
      - Api::V1::User
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: excludes the current user own private matches when viewing
            their own profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        scan_id:
                          type: string
                        scan_image_url:
                          type: string
                        ingredient_count:
                          type: integer
                        recipe_count:
                          type: integer
                        saves_count:
                          type: integer
                        created_at:
                          type: string
                        user_display_name:
                          nullable: true
                          type: string
                        user_avatar_url:
                          nullable: true
                        public:
                          type: boolean
                        ingredients:
                          type: array
                          items: {}
                        recipes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              thumbnail_url:
                                type: string
                              thumbnail_aspect_ratio:
                                type: number
                                format: float
                            required:
                            - id
                            - title
                            - thumbnail_url
                            - thumbnail_aspect_ratio
                        saved:
                          type: boolean
                        bookmark_id:
                          nullable: true
                        owned:
                          type: boolean
                      required:
                      - id
                      - scan_id
                      - scan_image_url
                      - ingredient_count
                      - recipe_count
                      - saves_count
                      - created_at
                      - user_display_name
                      - user_avatar_url
                      - public
                      - ingredients
                      - recipes
                      - saved
                      - bookmark_id
                      - owned
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
                    required:
                    - page
                    - pages
                    - count
                required:
                - data
                - pagination
        '404':
          description: returns 404 for a blocked creator
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Session token returned from POST /sign_in
