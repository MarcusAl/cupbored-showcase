---
openapi: 3.0.3
info:
  title: cupbored.ai API
  version: v1
  description: AI-powered ingredient detection and recipe matching platform
servers:
- url: https://api.cupbored.ai
  description: Production
paths:
  "/api/v1/blocks":
    get:
      summary: index
      tags:
      - Api::V1::Block
      responses:
        '200':
          description: returns blocks most-recent-first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        blocked_user_id:
                          type: string
                        display_name:
                          type: string
                          nullable: true
                      required:
                      - id
                      - blocked_user_id
                      - display_name
                required:
                - data
    post:
      summary: create
      tags:
      - Api::V1::Block
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                match_id:
                  type: string
                blocked_user_id:
                  type: string
      responses:
        '201':
          description: drops follows between the two accounts in both directions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      blocked_user_id:
                        type: string
                    required:
                    - id
                    - blocked_user_id
                required:
                - data
        '404':
          description: returns 404 when the match is another user private match
          content:
            text/html:
              schema:
                type: string
        '422':
          description: returns 422 when blocking the author of your own match
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/blocks/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Block
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: removes a block the current user owns and returns 204
        '404':
          description: returns 404 for a block the current user does not own
          content:
            text/html:
              schema:
                type: string
  "/api/v1/bookmarks":
    get:
      summary: index
      tags:
      - Api::V1::Bookmark
      responses:
        '200':
          description: does not trigger N+1 queries when returning multiple matches
            with recipes and ingredients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        scan_id:
                          type: string
                        scan_image_url:
                          type: string
                        ingredient_count:
                          type: integer
                        recipe_count:
                          type: integer
                        saves_count:
                          type: integer
                        created_at:
                          type: string
                        user_display_name:
                          nullable: true
                          type: string
                        public:
                          type: boolean
                        ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                            required:
                            - name
                        recipes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              thumbnail_url:
                                nullable: true
                                type: string
                              thumbnail_aspect_ratio:
                                type: number
                                format: float
                            required:
                            - id
                            - title
                            - thumbnail_url
                        saved:
                          type: boolean
                        bookmark_id:
                          type: string
                        user_avatar_url:
                          nullable: true
                          type: string
                        owned:
                          type: boolean
                      required:
                      - id
                      - scan_id
                      - scan_image_url
                      - ingredient_count
                      - recipe_count
                      - saves_count
                      - created_at
                      - user_display_name
                      - public
                      - ingredients
                      - recipes
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
                    required:
                    - page
                    - pages
                    - count
                required:
                - data
                - pagination
    post:
      summary: create
      tags:
      - Api::V1::Bookmark
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                match_id:
                  type: string
              required:
              - match_id
      responses:
        '201':
          description: allows a user to bookmark their own private match
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      match_id:
                        type: string
                    required:
                    - id
                    - match_id
                required:
                - data
        '404':
          description: returns 404 when bookmarking another user private match
          content:
            text/html:
              schema:
                type: string
        '422':
          description: rejects duplicate bookmarks with errors array
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/bookmarks/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Bookmark
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: removes a bookmark
  "/api/v1/channels/{channel_id}/recipes":
    get:
      summary: recipes
      tags:
      - Api::V1::Channel
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: paginates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        thumbnail_url:
                          type: string
                        thumbnail_aspect_ratio:
                          type: number
                          format: float
                        community_rating:
                          nullable: true
                        community_ratings_count:
                          type: integer
                        total_time_minutes:
                          type: integer
                        servings:
                          nullable: true
                        difficulty:
                          type: integer
                        like_count:
                          type: integer
                        dietary_tags:
                          type: array
                          items: {}
                        your_rating:
                          nullable: true
                        calories:
                          type: integer
                        bookmarked:
                          type: boolean
                        bookmark_id:
                          nullable: true
                      required:
                      - id
                      - title
                      - thumbnail_url
                      - thumbnail_aspect_ratio
                      - community_rating
                      - community_ratings_count
                      - total_time_minutes
                      - servings
                      - difficulty
                      - like_count
                      - dietary_tags
                      - your_rating
                      - calories
                      - bookmarked
                      - bookmark_id
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
                    required:
                    - page
                    - pages
                    - count
                required:
                - data
                - pagination
  "/api/v1/channels/{id}":
    get:
      summary: show
      tags:
      - Api::V1::Channel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: reports whether the current user follows it
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      handle:
                        type: string
                        nullable: true
                      avatar_url:
                        type: string
                      recipes_count:
                        type: integer
                      subscriber_count:
                        type: integer
                      youtube_url:
                        type: string
                      instagram_url:
                        type: string
                        nullable: true
                      followed:
                        type: boolean
                    required:
                    - id
                    - name
                    - handle
                    - avatar_url
                    - recipes_count
                    - subscriber_count
                    - youtube_url
                    - instagram_url
                    - followed
                required:
                - data
        '404':
          description: returns 404 for an unknown channel
          content:
            text/html:
              schema:
                type: string
  "/api/v1/comments/{comment_id}/like":
    delete:
      summary: destroy
      tags:
      - Api::V1::CommentLike
      parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: unlikes the comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      body:
                        type: string
                      created_at:
                        type: string
                      edited:
                        type: boolean
                      status:
                        type: string
                      likes_count:
                        type: integer
                      replies_count:
                        type: integer
                      liked:
                        type: boolean
                      owned:
                        type: boolean
                      author:
                        type: object
                        properties:
                          id:
                            type: string
                          display_name:
                            type: string
                          avatar_url:
                            nullable: true
                            type: string
                        required:
                        - id
                        - display_name
                        - avatar_url
                    required:
                    - id
                    - body
                    - created_at
                    - edited
                    - status
                    - likes_count
                    - replies_count
                    - liked
                    - owned
                    - author
                required:
                - data
    post:
      summary: create
      tags:
      - Api::V1::CommentLike
      parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: is idempotent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      body:
                        type: string
                      created_at:
                        type: string
                      edited:
                        type: boolean
                      status:
                        type: string
                      likes_count:
                        type: integer
                      replies_count:
                        type: integer
                      liked:
                        type: boolean
                      owned:
                        type: boolean
                      author:
                        type: object
                        properties:
                          id:
                            type: string
                          display_name:
                            type: string
                          avatar_url:
                            nullable: true
                            type: string
                        required:
                        - id
                        - display_name
                        - avatar_url
                    required:
                    - id
                    - body
                    - created_at
                    - edited
                    - status
                    - likes_count
                    - replies_count
                    - liked
                    - owned
                    - author
                required:
                - data
        '404':
          description: returns 404 for a comment the requester cannot see
          content:
            text/html:
              schema:
                type: string
  "/api/v1/comments/{comment_id}/replies":
    get:
      summary: replies
      tags:
      - Api::V1::Comment
      parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: lists the replies chronologically
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        body:
                          type: string
                        created_at:
                          type: string
                        edited:
                          type: boolean
                        status:
                          type: string
                        likes_count:
                          type: integer
                        replies_count:
                          type: integer
                        liked:
                          type: boolean
                        owned:
                          type: boolean
                        author:
                          type: object
                          properties:
                            id:
                              type: string
                            display_name:
                              type: string
                            avatar_url:
                              nullable: true
                              type: string
                          required:
                          - id
                          - display_name
                          - avatar_url
                      required:
                      - id
                      - body
                      - created_at
                      - edited
                      - status
                      - likes_count
                      - replies_count
                      - liked
                      - owned
                      - author
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        nullable: true
                      count:
                        type: integer
                    required:
                    - next_cursor
                    - count
                required:
                - data
                - pagination
        '404':
          description: returns 404 for a comment the requester cannot see
          content:
            text/html:
              schema:
                type: string
  "/api/v1/comments/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Comment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deletes the comment
        '404':
          description: returns 404 for another user comment
          content:
            text/html:
              schema:
                type: string
    patch:
      summary: update
      tags:
      - Api::V1::Comment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                body:
                  type: string
              required:
              - body
      responses:
        '200':
          description: shows the author their own pending edit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      body:
                        type: string
                      created_at:
                        type: string
                      edited:
                        type: boolean
                      status:
                        type: string
                      likes_count:
                        type: integer
                      replies_count:
                        type: integer
                      liked:
                        type: boolean
                      owned:
                        type: boolean
                      author:
                        type: object
                        properties:
                          id:
                            type: string
                          display_name:
                            nullable: true
                          avatar_url:
                            nullable: true
                            type: string
                        required:
                        - id
                        - display_name
                        - avatar_url
                    required:
                    - id
                    - body
                    - created_at
                    - edited
                    - status
                    - likes_count
                    - replies_count
                    - liked
                    - owned
                    - author
                required:
                - data
        '404':
          description: returns 404 for another user comment
          content:
            text/html:
              schema:
                type: string
  "/api/v1/creators":
    get:
      summary: index
      tags:
      - Api::V1::Creator
      responses:
        '200':
          description: omits a channel with no recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        name:
                          type: string
                        avatar_url:
                          type: string
                          nullable: true
                        count:
                          type: integer
                        followed:
                          type: boolean
                      required:
                      - id
                      - type
                      - name
                      - avatar_url
                      - count
                      - followed
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
                    required:
                    - page
                    - pages
                    - count
                required:
                - data
                - pagination
        '400':
          description: rejects a type outside the allowlist
          content:
            text/html:
              schema:
                type: string
        '401':
          description: requires authentication
          content:
            text/plain:
              schema:
                type: string
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
  "/api/v1/follows":
    get:
      summary: index
      tags:
      - Api::V1::Follow
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: never returns another user follows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        creator:
                          type: object
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                            name:
                              type: string
                            avatar_url:
                              type: string
                              nullable: true
                            count:
                              type: integer
                            followed:
                              type: boolean
                          required:
                          - id
                          - type
                          - name
                          - avatar_url
                          - count
                          - followed
                      required:
                      - id
                      - creator
                required:
                - data
    post:
      summary: create
      tags:
      - Api::V1::Follow
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type:
                  type: string
                followable_id:
                  type: string
              required:
              - type
              - followable_id
      responses:
        '201':
          description: follows another user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      creator:
                        type: object
                        properties:
                          id:
                            type: string
                          type:
                            type: string
                          name:
                            type: string
                          avatar_url:
                            type: string
                          count:
                            type: integer
                          followed:
                            type: boolean
                        required:
                        - id
                        - type
                        - name
                        - avatar_url
                        - count
                        - followed
                    required:
                    - id
                    - creator
                required:
                - data
        '400':
          description: returns 400 for a type outside the allowlist
          content:
            text/html:
              schema:
                type: string
        '404':
          description: returns 404 when the creator has blocked the current user
          content:
            text/html:
              schema:
                type: string
        '422':
          description: returns 422 when following the same creator twice
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/follows/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Follow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: unfollows and returns 204
        '404':
          description: returns 404 for another user follow
          content:
            text/html:
              schema:
                type: string
  "/api/v1/identity/email":
    patch:
      summary: update
      tags:
      - Api::V1::Identity::Email
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password_challenge:
                  type: string
              required:
              - email
              - password_challenge
      responses:
        '200':
          description: does not enqueue a verification email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        nullable: true
                      verified:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - email
                    - display_name
                    - verified
                    - created_at
                    - updated_at
                required:
                - data
        '401':
          description: returns unauthorized
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: returns unprocessable content
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/identity/email_verification":
    get:
      summary: show
      tags:
      - Api::V1::Identity::EmailVerification
      parameters:
      - name: sid
        in: query
        required: false
        schema:
          type: string
      responses:
        '204':
          description: marks the user as verified
        '400':
          description: returns bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
    post:
      summary: create
      tags:
      - Api::V1::Identity::EmailVerification
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
      responses:
        '204':
          description: enqueues a verification email
        '401':
          description: returns unauthorized
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/identity/password_reset":
    patch:
      summary: update
      tags:
      - Api::V1::Identity::PasswordReset
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sid:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
              - sid
              - password
              - password_confirmation
      responses:
        '200':
          description: returns the user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        nullable: true
                      verified:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - email
                    - display_name
                    - verified
                    - created_at
                    - updated_at
                required:
                - data
        '400':
          description: returns bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '422':
          description: returns unprocessable content
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
    post:
      summary: create
      tags:
      - Api::V1::Identity::PasswordReset
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
      responses:
        '204':
          description: returns no content without revealing the account state
  "/api/v1/matches":
    get:
      summary: index
      tags:
      - Api::V1::Match
      responses:
        '200':
          description: includes matches from all authors when no blocks exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        scan_id:
                          type: string
                        scan_image_url:
                          type: string
                        ingredient_count:
                          type: integer
                        recipe_count:
                          type: integer
                        saves_count:
                          type: integer
                        created_at:
                          type: string
                        user_display_name:
                          nullable: true
                          type: string
                        public:
                          type: boolean
                        ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                            required:
                            - name
                        recipes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              thumbnail_url:
                                nullable: true
                                type: string
                              thumbnail_aspect_ratio:
