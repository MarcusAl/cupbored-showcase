        '429':
          description: returns 429 when the global cap is hit
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '503':
          description: scan processing temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/scans/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Scan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: deletes the scan
    get:
      summary: show
      tags:
      - Api::V1::Scan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: returns ingredients and match_id when completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                      rejection_reason:
                        nullable: true
                      match_id:
                        nullable: true
                        type: string
                      ingredients:
                        nullable: true
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            raw_name:
                              type: string
                            category:
                              type: string
                            confidence:
                              type: number
                              format: float
                          required:
                          - name
                          - raw_name
                          - category
                          - confidence
                    required:
                    - id
                    - status
                    - rejection_reason
                    - match_id
                    - ingredients
                required:
                - data
        '404':
          description: returns 404 for another users scan
          content:
            text/html:
              schema:
                type: string
  "/api/v1/sessions":
    get:
      summary: index
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: marks only the requesting session as current
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created_at:
                          type: string
                        expires_at:
                          type: string
                        ip_address:
                          nullable: true
                        user_agent:
                          nullable: true
                        user_id:
                          type: string
                        updated_at:
                          type: string
                        current:
                          type: boolean
                      required:
                      - id
                      - created_at
                      - expires_at
                      - ip_address
                      - user_agent
                      - user_id
                      - updated_at
                      - current
                required:
                - data
        '401':
          description: rejects an invalid token
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/sessions/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: destroys the session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                required:
                - data
        '401':
          description: rejects an expired session token
          content:
            text/plain:
              schema:
                type: string
    get:
      summary: show
      tags:
      - Api::V1::Session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: shows the session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      created_at:
                        type: string
                      expires_at:
                        type: string
                      ip_address:
                        nullable: true
                      user_agent:
                        nullable: true
                      user_id:
                        type: string
                      updated_at:
                        type: string
                      current:
                        type: boolean
                    required:
                    - id
                    - created_at
                    - expires_at
                    - ip_address
                    - user_agent
                    - user_id
                    - updated_at
                    - current
                required:
                - data
  "/api/v1/sign_in":
    post:
      summary: create
      tags:
      - Api::V1::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '201':
          description: creates a session and returns a token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        type: object
                        properties:
                          id:
                            type: string
                          created_at:
                            type: string
                          expires_at:
                            type: string
                          ip_address:
                            type: string
                          updated_at:
                            type: string
                          user_agent:
                            nullable: true
                          user_id:
                            type: string
                        required:
                        - id
                        - created_at
                        - expires_at
                        - ip_address
                        - updated_at
                        - user_agent
                        - user_id
                      token:
                        type: string
                    required:
                    - session
                    - token
                required:
                - data
        '401':
          description: rejects invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/sign_out":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: destroys only the current session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                required:
                - data
        '401':
          description: rejects an invalid token
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/sign_up":
    post:
      summary: create
      tags:
      - Api::V1::Registration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '201':
          description: creates a user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        nullable: true
                      verified:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - email
                    - display_name
                    - verified
                    - created_at
                    - updated_at
                required:
                - data
        '400':
          description: rejects a Gmail alias of an existing account without creating
            a second user
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
  "/api/v1/suggested_creators":
    get:
      summary: index
      tags:
      - Api::V1::SuggestedCreator
      responses:
